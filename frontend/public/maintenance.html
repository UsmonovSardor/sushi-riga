<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cherry Sushi — Скоро вернёмся</title>

  <link rel="icon" href="/logo.jpg" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #fff7f7;
      color: #111;
      text-align: center;
      padding: 20px;
    }

    .box {
      max-width: 520px;
      background: #fff;
      padding: 36px;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.08);
    }

    img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      border-radius: 22px;
      margin-bottom: 18px;
    }

    h1 {
      color: #e31e24;
      margin: 0 0 12px;
      font-size: 30px;
    }

    p {
      color: #555;
      font-size: 17px;
      line-height: 1.5;
      margin: 0;
    }
  </style>
</head>

<body>
  <div class="box">
    <img src="/logo.jpg" alt="Cherry Sushi logo" />
    
    <h1>Мы скоро вернёмся</h1>

    <p>
      Извините, на сайте идут технические работы.<br />
      Мы скоро снова будем доступны.
    </p>
  </div>
</body>
</html>
