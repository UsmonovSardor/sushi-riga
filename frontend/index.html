<!doctype html>
<html lang="lv">
  <head>
    <meta charset="UTF-8" />

    <!-- 🔥 LOGO (favicon — optimized) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- 📱 RESPONSIVE (pinch-zoom allowed for accessibility) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- 📲 PWA / STANDALONE (install as app) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cherry Sushi" />

    <!-- ⚡ PERFORMANCE: warm up external origins early -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://lh3.googleusercontent.com" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://sushi-riga-api-production-7b54.up.railway.app" crossorigin />

    <!-- ⚡ LCP: preload the first hero image (must match HeroSlider slide 1 URL) -->
    <link rel="preload" as="image" fetchpriority="high"
      href="https://images.unsplash.com/photo-1617196034183-421b4040ed20?w=1200&h=600&fit=crop&auto=format&q=70" />

    <!-- 🔤 FONT (non-blocking) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
    </noscript>

    <!-- 🧠 SEO -->
    <title>Cherry Sushi — Suši Rīgā</title>
    <meta name="description" content="Cherry Sushi — svaigi suši Rīgā. Katru dienu 11:00–22:00. Lokomotīves iela 100." />
    <link rel="canonical" href="https://cherrysushi.eu" />

    <!-- 📸 OPEN GRAPH (Google + Telegram + Instagram preview) -->
    <meta property="og:site_name" content="Cherry Sushi" />
    <meta property="og:title" content="Cherry Sushi — Suši Rīgā" />
    <meta property="og:description" content="Svaigi suši katru dienu. Lokomotīves iela 100, Rīga." />
    <meta property="og:type" content="restaurant" />
    <!-- Appetizing landscape shot converts far better in social/chat previews than the square logo -->
    <meta property="og:image" content="https://images.unsplash.com/photo-1617196034183-421b4040ed20?w=1200&h=630&fit=crop&auto=format&q=75" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fresh sushi rolls — Cherry Sushi Rīga" />
    <meta property="og:url" content="https://cherrysushi.eu" />
    <meta property="og:locale" content="lv_LV" />
    <meta property="og:locale:alternate" content="ru_RU" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- 🐦 TWITTER -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cherry Sushi — Suši Rīgā" />
    <meta name="twitter:description" content="Svaigi suši katru dienu. Lokomotīves iela 100, Rīga." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1617196034183-421b4040ed20?w=1200&h=630&fit=crop&auto=format&q=75" />
