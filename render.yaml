services:
  # ── BACKEND ─────────────────────────────────────────────────
  - type: web
    name: sushi-riga-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  # ── FRONTEND ────────────────────────────────────────────────
  - type: web
    name: sushi-riga-app
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist -l 3000
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        sync: false
