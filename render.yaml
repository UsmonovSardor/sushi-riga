services:
  # ── BACKEND ──────────────────────────────────────────
  - type: web
    name: sushi-riga-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://sushi-riga.onrender.com

  # ── FRONTEND ─────────────────────────────────────────
  - type: web
    name: sushi-riga
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://sushi-riga-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
